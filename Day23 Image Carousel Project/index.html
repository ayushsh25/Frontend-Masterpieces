<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="main-container">

    <!-- Left Side Thumbnails -->

    <div class="col-1">

        <div class="items">

            <div class="item active">
                <img src="./imgs/shopping.webp" alt="">
            </div>

            <div class="item">
                <img src="./imgs/shopping (1).webp" alt="">
            </div>

            <div class="item">
                <img src="./imgs/shopping (2).webp" alt="">
            </div>

            <div class="item">
                <img src="./imgs/shopping (3).webp" alt="">
            </div>

            <div class="item">
                <img src="./imgs/shopping (4).webp" alt="">
            </div>

        </div>

    </div>

    <!-- Main Slider -->

    <div class="col-2">

        <div class="carousel">

            <button id="prevBtn">
                <i class="fa-solid fa-angle-left"></i>
            </button>

            <button id="nextBtn">
                <i class="fa-solid fa-angle-right"></i>
            </button>

            <div class="slides-container">

                <div class="slide">
                    <img src="./imgs/shopping.webp" alt="">
                </div>

                <div class="slide">
                    <img src="./imgs/shopping (1).webp" alt="">
                </div>

                <div class="slide">
                    <img src="./imgs/shopping (2).webp" alt="">
                </div>

                <div class="slide">
                    <img src="./imgs/shopping (3).webp" alt="">
                </div>

                <div class="slide">
                    <img src="./imgs/shopping (4).webp" alt="">
                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
