<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced BMI Calculator</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <h1>
            <i class="fa-solid fa-heart-pulse"></i>
            BMI Calculator
        </h1>

        <form id="bmiForm">

            <!-- Gender -->
            <div class="form-group">
                <label for="gender">
                    <i class="fa-solid fa-user"></i>
                    Gender
                </label>

                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Age -->
            <div class="form-group">
                <label for="age">
                    <i class="fa-solid fa-calendar"></i>
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter your age"
                    min="2"
                    max="120"
                    required>
            </div>

            <!-- Height -->
            <div class="form-group">
                <label>
                    <i class="fa-solid fa-ruler-vertical"></i>
                    Height
                </label>

                <div class="height-box">

                    <input
                        type="number"
                        id="height-feet"
                        placeholder="Feet"
                        min="1"
                        required>

                    <input
                        type="number"
                        id="height-inches"
                        placeholder="Inches"
                        min="0"
                        max="11"
                        required>

                </div>
            </div>

            <!-- Weight -->
            <div class="form-group">
                <label for="weight">
                    <i class="fa-solid fa-weight-scale"></i>
                    Weight (kg)
                </label>

                <input
                    type="number"
                    id="weight"
                    placeholder="Enter your weight"
                    min="1"
                    required>
            </div>

            <!-- Buttons -->
            <div class="button-group">

                <button type="submit" class="calculate-btn">
                    <i class="fa-solid fa-calculator"></i>
                    Calculate BMI
                </button>

                <button type="reset" id="resetBtn" class="reset-btn">
                    <i class="fa-solid fa-rotate-left"></i>
                    Reset
                </button>

            </div>

        </form>

        <!-- Result Card -->
        <div id="resultCard" class="result-card">

            <h2>Your BMI Report</h2>

            <div class="result-item">
                <span>Gender</span>
                <strong id="displayGender">-</strong>
            </div>

            <div class="result-item">
                <span>Age</span>
                <strong id="displayAge">-</strong>
            </div>

            <div class="result-item">
                <span>BMI</span>
                <strong id="displayBMI">0.00</strong>
            </div>

            <div class="result-item">
                <span>Status</span>
                <strong id="displayCategory">-</strong>
            </div>

            <div class="result-item">
                <span>Healthy Weight Range</span>
                <strong id="healthyWeight">-</strong>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">

                <div class="progress-bar">
                    <div id="progress"></div>
                </div>

            </div>

            <!-- Health Tip -->
            <div id="healthTip" class="tip-box">
                Health tips will appear here.
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
