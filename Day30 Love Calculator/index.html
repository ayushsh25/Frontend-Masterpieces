<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator ❤️</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤</span>
        <span>💕</span>
        <span>💖</span>
        <span>💗</span>
        <span>💘</span>
        <span>❤</span>
        <span>💕</span>
        <span>💖</span>
    </div>

    <div class="container">

        <h1>
            <i class="fa-solid fa-heart"></i>
            Love Calculator
        </h1>

        <p class="subtitle">
            Discover your love compatibility ❤️
        </p>

        <form id="loveForm">

            <div class="input-group">

                <label>Your Name</label>

                <input
                    type="text"
                    id="yourName"
                    placeholder="Enter your name"
                    required>

            </div>

            <div class="heart-icon">
                ❤️
            </div>

            <div class="input-group">

                <label>Partner's Name</label>

                <input
                    type="text"
                    id="partnerName"
                    placeholder="Enter partner's name"
                    required>

            </div>

            <div class="button-group">

                <button type="submit" class="calculate-btn">

                    <i class="fa-solid fa-heart-circle-check"></i>

                    Calculate Love

                </button>

                <button type="reset" id="resetBtn" class="reset-btn">

                    <i class="fa-solid fa-rotate-left"></i>

                    Reset

                </button>

            </div>

        </form>

        <!-- Result Card -->

        <div class="result-card" id="resultCard">

            <div class="heart-animation">

                ❤️

            </div>

            <h2>Your Love Score</h2>

            <h1 id="lovePercent">

                0%

            </h1>

            <!-- Progress Bar -->

            <div class="progress-container">

                <div class="progress-bar">

                    <div id="progress"></div>

                </div>

            </div>

            <h3 id="relationshipStatus">

                Waiting...

            </h3>

            <p id="loveMessage">

                Enter both names to discover your compatibility.

            </p>

            <button id="shareBtn" class="share-btn">

                <i class="fa-solid fa-share-nodes"></i>

                Share Result

            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
